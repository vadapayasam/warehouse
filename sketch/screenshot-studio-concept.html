@media(min-width:1600px){.workspace{grid-template-columns:1fr 320px}.stage{padding-top:38px;padding-bottom:30px}}

<body>
<div class="app">
<header class="topbar"><div class="identity"><strong>Screenshot Studio</strong><span class="sep">/</span><details class="document" id="documentMenu"><summary>Fieldnotes ▾</summary><div class="menu"><button id="openProject">Open project…</button><button id="saveProject">Save project</button><button id="newProject">New blank project</button></div></details><span class="concept">Concept</span></div><div class="actions"><span class="save-status" id="saveStatus" role="status">Saved locally</span><button class="icon" id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M8 5 3 10l5 5M3 10h11a6 6 0 0 1 0 12" transform="translate(0 -3)"/></svg></button><button class="icon desktop-only" id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m16 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -3)"/></svg></button><button class="icon mobile-only" id="editMobile" aria-label="Edit selected slide" aria-controls="inspector" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg></button><button class="primary" id="export">Export</button></div></header>
<main class="workspace"><div class="left"><section class="stage" id="stage" aria-label="Selected slide preview"><div class="artwork" id="artwork"><img id="preview" alt=""><button class="hotspot text" aria-label="Edit headline" data-focus="headline"></button><button class="hotspot device" aria-label="Edit screenshot" data-focus="replace"></button></div><span class="stage-meta">1000 × 1600</span><div class="drop-state">Drop screenshots</div></section><nav class="filmstrip" aria-label="Slides"><div class="slides" id="slides"></div><button class="add" id="add" aria-label="Add slide">＋</button></nav></div>
<aside class="inspector" id="inspector" aria-label="Slide inspector"><div class="inspector-head"><h1 id="slideName">Slide 1</h1><select id="scope" class="scope" aria-label="Style scope"><option value="slide">This slide</option><option value="all">All slides</option></select><button class="icon mobile-only" id="closeInspector" aria-label="Close inspector">×</button></div>
<div class="section"><div class="field"><label for="headline">Headline</label><textarea id="headline" maxlength="90" rows="2"></textarea></div><div class="field"><label for="subtitle">Subtitle</label><input id="subtitle" type="text" maxlength="100" placeholder="Optional"></div></div>
<div class="section"><div class="field"><label>Background</label><div class="swatches" id="swatches"></div></div><div class="field"><label for="layout">Composition</label><select class="control" id="layout"><option value="top">Headline above</option><option value="bottom">Headline below</option></select></div></div>
<div class="section"><div class="subheading"><label for="frame">Screenshot</label><button id="replace" class="quiet">Replace…</button></div><select class="control" id="frame" aria-label="Device frame"><option value="dark">Dark frame</option><option value="light">Light frame</option><option value="none">No frame</option></select><div class="field" style="margin-top:18px;margin-bottom:0"><label for="scale">Device size</label><input id="scale" type="range" min="78" max="110" value="100" style="width:100%;accent-color:var(--accent);min-height:44px"></div></div>
<div class="section"><div class="row"><button id="duplicate">Duplicate</button><button id="remove">Delete</button></div><div class="slide-tools"><button id="moveLeft" aria-label="Move slide left">←</button><button id="moveRight" aria-label="Move slide right">→</button></div></div>
</aside></main></div>
<input type="file" id="images" accept="image/png,image/jpeg,image/webp" multiple hidden><input type="file" id="project" accept=".json,application/json" hidden><div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>This interactive concept needs JavaScript. No account or server is required.</noscript>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='screenshot-studio-concept-v1',colors=['#dce6ed','#eee6da','#e3e6d8','#e7dfe9'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const uri=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const uid=()=>crypto.randomUUID();
function sampleScreen(kind=0){const rows=[['A place for unfinished thoughts','Ideas worth keeping','The long way home','A small weekend ritual'],['Collected, not forgotten','On making things','A good question','A little inspiration'],['Give an idea some space','Start with a sentence','Let it be a little messy','Come back tomorrow']][kind];return uri(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1100" viewBox="0 0 600 1100"><rect width="600" height="1100" fill="#fbfaf7"/><text x="40" y="55" font-family="Arial" font-size="20" fill="#262c30">9:41</text><path d="M510 39h38v16h-38z" fill="none" stroke="#262c30" stroke-width="2"/><text x="40" y="160" font-family="Arial" font-size="48" font-weight="700" fill="#253c37">Fieldnotes</text><text x="40" y="201" font-family="Arial" font-size="19" fill="#747a71">SAMPLE NOTEBOOK</text><rect x="36" y="240" width="528" height="74" rx="14" fill="#eeede7"/><text x="63" y="286" font-family="Arial" font-size="23" fill="#757b73">Search your notes</text>${rows.map((r,i)=>`<rect x="36" y="${350+i*152}" width="528" height="130" rx="14" fill="${i===0?'#e6eadf':'#f2f1eb'}"/><text x="60" y="${398+i*152}" font-family="Arial" font-size="24" font-weight="600" fill="#293f37">${r}</text><text x="60" y="${439+i*152}" font-family="Arial" font-size="20" fill="#7a7f75">${['A few things to come back to.','Keep the interesting bits.','Nothing needs to be finished.','There is always another page.'][i]}</text>`).join('')}<circle cx="511" cy="1020" r="38" fill="#29493c"/><path d="M494 1020h34m-17-17v34" stroke="#fff" stroke-width="3"/></svg>`)}
function board(p={}){return {id:uid(),headline:'',subtitle:'',background:colors[0],layout:'top',frame:'dark',scale:100,image:null,...p}}
function initial(){return {version:1,selected:0,slides:[board({headline:'Make room for\na good idea.',subtitle:'A notebook that feels like yours.',image:sampleScreen(0)}),board({headline:'Keep what\ncatches your eye.',subtitle:'Collect the things you want to come back to.',background:colors[1],image:sampleScreen(1)}),board({headline:'Find your\nnext sentence.',subtitle:'A little space to think clearly.',background:colors[2],image:sampleScreen(2)})]}}
function validate(s){if(!s||s.version!==1||!Array.isArray(s.slides)||!s.slides.length||s.slides.length>20)throw Error('Choose a version 1 project with 1–20 slides.');const ids=new Set();s.slides.forEach(b=>{if(typeof b.id!=='string'||ids.has(b.id)||typeof b.headline!=='string'||typeof b.subtitle!=='string'||!/^#[0-9a-f]{6}$/i.test(b.background)||!['top','bottom'].includes(b.layout)||!['dark','light','none'].includes(b.frame)||!Number.isFinite(b.scale)||b.scale<78||b.scale>110||!(b.image===null||typeof b.image==='string'&&/^data:image\/(png|jpeg|webp|svg\+xml)[;,]/.test(b.image)))throw Error('This project contains an unsupported slide.');ids.add(b.id)});s.selected=Math.max(0,Math.min(Number.isInteger(s.selected)?s.selected:0,s.slides.length-1));return s}
let state=initial(),past=[],future=[],saveError=false;try{const saved=localStorage.getItem(KEY);if(saved)state=validate(JSON.parse(saved))}catch{saveError=true}
const clone=x=>JSON.parse(JSON.stringify(x));
function notify(text){$('toast').textContent=text;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').textContent='',3500)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));saveError=false;$('saveStatus').textContent='Saved locally'}catch{saveError=true;$('saveStatus').textContent='Draft not saved';notify('Storage is full. Save a project file to keep your work.')}}
function commit(fn){const before=clone(state);fn(state);validate(state);past.push(before);if(past.length>30)past.shift();future=[];persist();render()}
function patch(key,value){commit(s=>{const targets=$('scope').value==='all'&&['background','layout','frame','scale'].includes(key)?s.slides:[s.slides[s.selected]];targets.forEach(b=>b[key]=value)})}
function wrap(text,max=23){return text.split('\n').flatMap(line=>{const words=line.split(/\s+/);let rows=[''];for(const w of words){let i=rows.length-1;if((rows[i]+' '+w).trim().length>max&&rows[i])rows.push(w);else rows[i]=(rows[i]+' '+w).trim()}return rows}).slice(0,3)}
function renderSVG(b){const bottom=b.layout==='bottom',lines=wrap(b.headline),scale=b.scale/100,w=620*scale,h=w*1.84,x=(1000-w)/2,y=bottom?90:500;let titleY=bottom?1310:155;return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1600" viewBox="0 0 1000 1600"><defs><clipPath id="screen"><rect x="${x+14}" y="${y+14}" width="${w-28}" height="${h-28}" rx="${b.frame==='none'?12:65}"/></clipPath></defs><rect width="1000" height="1600" fill="${b.background}"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#24343b">${lines.map((l,i)=>`<text x="500" y="${titleY+i*88}" font-size="78" font-weight="700" letter-spacing="-3">${esc(l)}</text>`).join('')}<text x="500" y="${titleY+lines.length*88+10}" font-size="25" fill="#52616a">${esc(b.subtitle)}</text></g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${b.frame==='none'?20:80}" fill="${b.frame==='light'?'#b4b8bc':b.frame==='none'?'transparent':'#292c2e'}"/>${b.image?`<image x="${x+14}" y="${y+14}" width="${w-28}" height="${h-28}" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen)" xlink:href="${esc(b.image)}"/>`:`<rect x="${x+14}" y="${y+14}" width="${w-28}" height="${h-28}" rx="65" fill="#ffffff60"/>`}${b.frame!=='none'?`<rect x="435" y="${y+29}" width="130" height="32" rx="16" fill="#202326"/>`:''}</svg>`}
function render(){const b=state.slides[state.selected];$('preview').src=uri(renderSVG(b));$('preview').alt=`Slide ${state.selected+1}: ${b.headline||'Untitled'}`;$('slideName').textContent=`Slide ${state.selected+1}`;['headline','subtitle','layout','frame','scale'].forEach(k=>$(k).value=b[k]);$('slides').replaceChildren();state.slides.forEach((b,i)=>{const btn=document.createElement('button');btn.className='thumb';btn.setAttribute('aria-current',i===state.selected?'true':'false');btn.setAttribute('aria-label',`Select slide ${i+1}: ${b.headline.replace(/\n/g,' ')||'Untitled'}`);const img=document.createElement('img');img.src=uri(renderSVG(b));img.alt='';const meta=document.createElement('span');const number=document.createElement('span');number.className='number';number.textContent=String(i+1).padStart(2,'0');const name=document.createElement('span');name.className='name';name.textContent=['Ideas','Collect','Write'][i]&&b.image?.includes('svg')?['Ideas','Collect','Write'][i]:`Slide ${i+1}`;meta.append(number,name);btn.append(img,meta);btn.onclick=()=>{state.selected=i;persist();render()};$('slides').append(btn)});$('swatches').replaceChildren();colors.forEach(c=>{const btn=document.createElement('button');btn.className='swatch';btn.setAttribute('aria-label',`Set background ${c}`);btn.setAttribute('aria-pressed',b.background===c?'true':'false');const dot=document.createElement('span');dot.style.background=c;btn.append(dot);btn.onclick=()=>patch('background',c);$('swatches').append(btn)});$('undo').disabled=!past.length;$('redo').disabled=!future.length;$('remove').disabled=state.slides.length===1;$('moveLeft').disabled=state.selected===0;$('moveRight').disabled=state.selected===state.slides.length-1;$('add').disabled=state.slides.length>=20;const empty=$('artwork').querySelector('.empty-upload');if(empty)empty.remove();if(!b.image){const btn=document.createElement('button');btn.className='empty-upload';btn.textContent='Add screenshots';btn.onclick=()=>$('images').click();$('artwork').append(btn)}const t=$('artwork').querySelector('.text'),d=$('artwork').querySelector('.device');t.style.top=b.layout==='bottom'?'78%':'7%';d.style.top=b.layout==='bottom'?'5%':'32%';d.style.bottom=b.layout==='bottom'?'27%':'5%'}
function undo(){if(!past.length)return;future.push(clone(state));state=past.pop();persist();render()}function redo(){if(!future.length)return;past.push(clone(state));state=future.pop();persist();render()}
function inspector(open){$('inspector').classList.toggle('open',open);$('editMobile').setAttribute('aria-expanded',String(open))}
$('editMobile').onclick=()=>inspector(!$('inspector').classList.contains('open'));$('closeInspector').onclick=()=>{inspector(false);$('editMobile').focus()};document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{inspector(true);$(b.dataset.focus).focus()});
['headline','subtitle','layout','frame'].forEach(k=>$(k).onchange=e=>patch(k,e.target.value));$('scale').onchange=e=>patch('scale',Number(e.target.value));$('undo').onclick=undo;$('redo').onclick=redo;
$('add').onclick=()=>commit(s=>{s.slides.push(board({background:s.slides[s.selected].background}));s.selected=s.slides.length-1});$('duplicate').onclick=()=>{if(state.slides.length>=20)return notify('This concept supports up to 20 slides.');commit(s=>{s.slides.splice(s.selected+1,0,{...clone(s.slides[s.selected]),id:uid()});s.selected++})};$('remove').onclick=()=>{commit(s=>{s.slides.splice(s.selected,1);s.selected=Math.min(s.selected,s.slides.length-1)});notify('Slide deleted. Undo to restore.')};function move(delta){commit(s=>{const from=s.selected,to=from+delta;[s.slides[from],s.slides[to]]=[s.slides[to],s.slides[from]];s.selected=to})}$('moveLeft').onclick=()=>move(-1);$('moveRight').onclick=()=>move(1);
async function readImage(file){if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Choose PNG, JPEG or WebP images.');if(file.size>8*1024*1024)throw Error('Use images smaller than 8 MB.');const url=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Could not read image.'));r.readAsDataURL(file)});await decode(url);return url}
function decode(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error('Could not decode image.'));img.src=src})}
async function upload(files){try{const list=Array.from(files);if(!list.length)return;const selected=state.slides[state.selected].id;const capacity=20-state.slides.length+1;if(list.length>capacity)throw Error(`You can add ${capacity} images to this project.`);const images=await Promise.all(list.map(readImage));commit(s=>{const index=s.slides.findIndex(b=>b.id===selected);if(index<0)throw Error('The selected slide no longer exists.');s.slides[index].image=images[0];s.slides.splice(index+1,0,...images.slice(1).map(image=>board({image,background:s.slides[index].background})));s.selected=index});notify(`${images.length===1?'Screenshot added':images.length+' screenshots added'}`)}catch(e){notify(e.message)}}
$('replace').onclick=()=>$('images').click();$('images').onchange=e=>{upload(e.target.files);e.target.value=''};
const stage=$('stage');stage.addEventListener('dragover',e=>{e.preventDefault();stage.classList.add('dragging')});stage.addEventListener('dragleave',e=>{if(!stage.contains(e.relatedTarget))stage.classList.remove('dragging')});stage.addEventListener('drop',e=>{e.preventDefault();stage.classList.remove('dragging');upload(e.dataTransfer.files)});
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('export').onclick=async()=>{const button=$('export');button.disabled=true;button.textContent='Exporting…';try{const img=await decode(uri(renderSVG(state.slides[state.selected]))),canvas=document.createElement('canvas');canvas.width=1000;canvas.height=1600;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw Error('Could not create image.');download(blob,`slide-${state.selected+1}.png`);notify('PNG exported · 1000 × 1600')}catch(e){notify(e.message)}finally{button.disabled=false;button.textContent='Export'}};
$('saveProject').onclick=()=>{download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'screenshot-project.json');$('documentMenu').open=false};$('openProject').onclick=()=>{$('project').click();$('documentMenu').open=false};$('project').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>40*1024*1024)throw Error('Project is too large.');const loaded=validate(JSON.parse(await f.text()));commit(s=>Object.assign(s,loaded));notify('Project opened')}catch(e){notify(e.message)}e.target.value=''};$('newProject').onclick=()=>{commit(s=>{s.slides=[board()];s.selected=0});$('documentMenu').open=false;notify('Blank project created. Undo restores the previous project.')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){inspector(false);$('documentMenu').open=false}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!['INPUT','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();e.shiftKey?redo():undo()}});
window.studioConcept={getState:()=>clone(state),setState:s=>{const valid=validate(clone(s));commit(current=>Object.assign(current,valid))},renderSVG:()=>renderSVG(state.slides[state.selected])};render();if(saveError){$('saveStatus').textContent='Draft unavailable';notify('The previous draft could not be restored. Save a project file to keep your work.')}
</script>
</body></html>
